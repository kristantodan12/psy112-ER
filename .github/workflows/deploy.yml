name: deploy-book

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Jupyter Book 2 reads BASE_URL when building the static site
  BASE_URL: /psy112-ER

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The site template is fetched and bundled with npm, so Node must be
      # available. Do not delete /usr/local/lib/node_modules here.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # This book executes nothing: every notebook carries `execute: {skip: true}`
      # and no markdown page has an executable {code-cell}, so the build is a pure
      # render of the stored outputs. Installing the scientific stack here would
      # only slow CI down -- and rpy2 cannot even be built without R on the runner.
      # The full environment students need in order to *run* the notebooks lives
      # in requirements.txt.
      - name: Install Jupyter Book
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.1.6"

      - name: Build the book
        run: |
          jupyter book build --html

      # GitHub Pages hides every path beginning with an underscore unless this
      # file is present. Without it the session slides in _static/ 404 on the
      # deployed site even though they build fine locally.
      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
